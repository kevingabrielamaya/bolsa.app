<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Cuenta - Bolsa de Confianza</title>
    <style>
        :root {
            --primary-color: #0f766e; /* Verde oscuro elegante */
            --bg-color: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .resumen-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .dato-box {
            display: flex;
            flex-direction: column;
        }

        .dato-box.full-width {
            grid-column: span 2;
        }

        .dato-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .dato-valor {
            font-size: 1rem;
            font-weight: 500;
        }

        .dato-total {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .seccion-tabla {
            padding: 20px;
        }

        .seccion-tabla h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background-color: #f9fafb;
            color: var(--text-muted);
            font-weight: 600;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .monto-col {
            text-align: right;
            font-weight: 500;
        }

        /* Mensaje cuando no hay datos */
        .sin-datos {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-style: italic;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <h1>Estado de Cuenta</h1>
            <p id="bolsa-nombre">Bolsa de Confianza</p>
        </div>

        <!-- Resumen del Participante -->
        <div class="resumen-grid">
            <div class="dato-box full-width">
                <span class="dato-label">Participante</span>
                <span class="dato-valor" id="participante-nombre">Cargando...</span>
            </div>
            
            <div class="dato-box">
                <span class="dato-label">Turno(s)</span>
                <span class="dato-valor" id="participante-turnos">-</span>
            </div>

            <div class="dato-box">
                <span class="dato-label">Total Abonado</span>
                <span class="dato-total" id="participante-abonado">$0.00</span>
            </div>

            <div class="dato-box full-width">
                <span class="dato-label">Períodos Asignados</span>
                <span class="dato-valor" id="participante-periodos">-</span>
            </div>
        </div>

        <!-- Historial de Pagos -->
        <div class="seccion-tabla">
            <h3>Detalle de Aportes</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Método</th>
                        <th class="monto-col">Bs.</th>
                        <th class="monto-col">$</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <!-- Las filas se insertarán aquí con JavaScript -->
                </tbody>
            </table>
            <div id="mensaje-vacio" class="sin-datos" style="display: none;">
                No hay aportes registrados aún.
            </div>
        </div>

        <!-- Pie de página -->
        <div class="footer">
            Generado automáticamente • Bolsa de Confianza
        </div>
    </div>

    <!-- SCRIPT PARA LEER LA URL Y LLENAR LOS DATOS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Obtener los parámetros de la URL enviados desde AppSheet
            const params = new URLSearchParams(window.location.search);
            
            const nombre = params.get('nombre');
            const bolsa = params.get('bolsa');
            const turnos = params.get('turnos');
            const abonado = params.get('abonado');
            const periodos = params.get('periodos');
            const pagosStr = params.get('pagos');

            // 1. Llenar los datos de la cabecera si existen
            if(nombre) document.getElementById('participante-nombre').textContent = nombre;
            if(bolsa) document.getElementById('bolsa-nombre').textContent = bolsa;
            if(turnos) document.getElementById('participante-turnos').textContent = turnos;
            if(periodos) document.getElementById('participante-periodos').textContent = periodos;
            
            // Formatear el total abonado con 2 decimales
            if(abonado) {
                const totalNum = parseFloat(abonado);
                if(!isNaN(totalNum)) {
                    document.getElementById('participante-abonado').textContent = `$${totalNum.toFixed(2)}`;
                }
            }

            // 2. Procesar la cadena de pagos para la tabla
            const tbody = document.getElementById('tabla-body');
            const mensajeVacio = document.getElementById('mensaje-vacio');

            if (pagosStr && pagosStr.trim() !== "") {
                // Separar cada pago por el punto y coma ";"
                const listaPagos = pagosStr.split(';');
                
                listaPagos.forEach(pago => {
                    // Separar los detalles del pago por la barra "|"
                    const detalles = pago.split('|');
                    
                    // Asegurarnos de que el pago tiene las 4 partes esperadas (Fecha, Forma, Monto$, MontoBs)
                    if (detalles.length === 4) {
                        const fecha = detalles[0].trim();
                        const formaPago = detalles[1].trim();
                        const montoDolares = parseFloat(detalles[2].trim()) || 0;
                        const montoBolivares = parseFloat(detalles[3].trim()) || 0;

                        // Crear la fila HTML
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${fecha}</td>
                            <td>${formaPago}</td>
                            <td class="monto-col">${montoBolivares > 0 ? montoBolivares.toLocaleString('es-VE') : '-'}</td>
                            <td class="monto-col">$${montoDolares.toFixed(2)}</td>
                        `;
                        tbody.appendChild(fila);
                    }
                });
            } else {
                // Si no hay pagos, mostramos el mensaje de que está vacío
                mensajeVacio.style.display = "block";
            }
        });
    </script>
</body>
</html>
